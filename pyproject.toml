[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=6.0,<8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scalgrafanalib"
dynamic = ["version"]
description = "Library for building Grafana dashboards at scality"
readme = "README.md"
authors = [
    { name = "Scality", email = "support@scality.com" }
]
license = { text = "Apache" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.6"
dependencies = [
    "attrs>=15.2.0",
    "grafanalib>=0.7.1",
]

[project.urls]
Source = "https://github.com/scality/scalgrafanalib"
Homepage = "https://github.com/scality/scalgrafanalib"

[project.optional-dependencies]
dev = [
    "black~=22.3.0",
    "mypy>=0.931",
    "pylint>=2.12.2",
    "pytest>=7.1.3",
    "types-setuptools",
]

[tool.setuptools]
packages = { find = {} }

[tool.setuptools_scm]
# Generate _version.py file at build time for runtime version access
write_to = "scalgrafanalib/_version.py"
